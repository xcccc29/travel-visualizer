// ── Map init ──────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

let activeMarkers = [];

function showDay(idx) {
  const day = days[idx];
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i===idx));
  document.getElementById('leftPanel').innerHTML = day.html;
  activeMarkers.forEach(m => map.removeLayer(m));
  activeMarkers = [];
  day.locs.forEach(loc => {
    const m = L.circleMarker([loc.lat, loc.lng], {
      radius: 9, fillColor: C[loc.t]||'#999',
      color:'#fff', weight:2, opacity:1, fillOpacity:0.92,
    });
    m.bindPopup(`<div style="font-family:-apple-system,sans-serif;min-width:155px;"><div style="font-weight:700;font-size:0.82rem;color:#1a2744;margin-bottom:3px;">${loc.n}</div><div style="font-size:0.74rem;color:#555;line-height:1.4;">${loc.d}</div></div>`);
    m.addTo(map);
    activeMarkers.push(m);
  });
  if (day.locs.length > 0) {
    const bounds = L.latLngBounds(day.locs.map(l=>[l.lat,l.lng]));
    map.fitBounds(bounds, { padding:[50,50], maxZoom: day.num===2||day.num===3||day.num===4?15:day.num===6||day.num===7?13:10 });
  }
}

// ── Build tabs ────────────────────────────────────────────────────────────────
const row = document.getElementById('tabsRow');
days.forEach((d,i)=>{
  const b = document.createElement('button');
  b.className = 'tab-btn';
  b.innerHTML = `<span class="tab-day">Day ${d.num}</span>${d.date}`;
  b.onclick = () => showDay(i);
  row.appendChild(b);
});

showDay(0);
</script>
